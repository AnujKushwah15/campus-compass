version: '3.8'

services:
  mediamtx:
    image: bluenviron/mediamtx:1.9.1
    container_name: campus_mediamtx
    restart: always
    network_mode: "host"
    volumes:
      - ./backend/mediamtx.yml:/mediamtx.yml:ro

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: campus_backend
    restart: always
    network_mode: "host"
    env_file: .env
    volumes:
      - ./backend/service-account.json:/app/service-account.json:ro

  nginx:
    image: nginx:alpine
    container_name: campus_nginx
    restart: always
    network_mode: "host"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - backend

  certbot:
    image: certbot/certbot
    container_name: campus_certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
