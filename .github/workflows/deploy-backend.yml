name: Deploy Backend to VPS

# Triggers on push to main or anuj when backend files change
on:
  push:
    branches:
      - main
      - anuj
    paths:
      - 'backend/**'

jobs:
  deploy:
    name: 🚀 Deploy to VPS
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    timeout-minutes: 10

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Write SSH key and transfer files via rsync ─────────────────────────
      # We write the key with printf to guarantee LF line endings.
      # GitHub Secrets textarea strips newlines; printf restores them at runtime.
      - name: Sync backend files to VPS
        env:
          VPS_IP: ${{ secrets.VPS_IP }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          # Write the SSH private key with proper newlines (printf handles \n in secret)
          mkdir -p ~/.ssh
          printf '%b' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Disable host key checking for CI (VPS IP is known, not user-supplied)
          cat >> ~/.ssh/config <<EOF
          Host $VPS_IP
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF

          # Test the connection before rsync
          ssh -i ~/.ssh/deploy_key root@$VPS_IP "echo '✅ SSH connection verified'"

          # Rsync backend files — excludes node_modules (installed on server)
          rsync -rlgoDzvc --delete \
            --exclude=node_modules \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            backend/ \
            root@$VPS_IP:/root/campus-compass-backend/

      # ── 3. Install deps + apply config + restart services ────────────────────
      - name: Install & restart services
        env:
          VPS_IP: ${{ secrets.VPS_IP }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%b' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no root@$VPS_IP 'bash -s' << 'ENDSSH'
            set -e
            BACKEND_DIR="/root/campus-compass-backend"
            cd "$BACKEND_DIR"

            # 1. Sync systemd service file if it changed
            if ! diff -q campus-compass.service /etc/systemd/system/campus-compass.service &>/dev/null; then
              echo "🔄 Service file changed — updating..."
              cp campus-compass.service /etc/systemd/system/campus-compass.service
              systemctl daemon-reload
            fi

            # 2. Sync MediaMTX config if it changed
            #    Config lives in /etc/mediamtx/mediamtx.yml (NOT /etc/mediamtx.yml)
            if ! diff -q mediamtx.yml /etc/mediamtx/mediamtx.yml &>/dev/null; then
              echo "🔄 MediaMTX config changed — updating..."
              mkdir -p /etc/mediamtx
              cp mediamtx.yml /etc/mediamtx/mediamtx.yml
              systemctl restart mediamtx
              sleep 2
              systemctl is-active mediamtx && echo "✅ mediamtx running" || { echo "❌ mediamtx failed to restart"; exit 1; }
            fi

            # 3. Install / update Node.js dependencies
            echo "📦 Installing Node.js dependencies..."
            npm ci --omit=dev --silent

            # 4. Restart the backend service
            echo "♻️  Restarting campus-compass service..."
            systemctl restart campus-compass
            sleep 3
            systemctl is-active campus-compass && echo "✅ campus-compass running" || {
              echo "❌ campus-compass failed to start"
              journalctl -u campus-compass -n 30 --no-pager
              exit 1
            }

            # 5. Health check
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/health)
            if [ "$HTTP" = "200" ]; then
              echo "✅ Health check passed (HTTP $HTTP)"
            else
              echo "❌ Health check failed (HTTP $HTTP)"
              journalctl -u campus-compass -n 30 --no-pager
              exit 1
            fi

            echo ""
            echo "🎉 Deploy complete — $(date)"
          ENDSSH

      # ── 4. Open a GitHub Issue on failure ────────────────────────────────────
      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 VPS Deploy Failed — ${context.sha.substring(0, 7)}`,
              body: `**Workflow:** ${context.workflow}\n**Branch:** ${context.ref}\n**Commit:** ${context.sha}\n\n[View run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              labels: ['bug', 'deployment']
            })
