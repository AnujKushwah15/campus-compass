name: Deploy Backend to VPS

# Triggers on any push to main or anuj branch that touches backend files
on:
  push:
    branches:
      - main
      - anuj
    paths:
      - 'backend/**'

jobs:
  deploy:
    name: 🚀 Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Sync ALL backend files via Rsync ────────────────────────────────
      - name: Sync Backend files to VPS
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          # Exclude node_modules so we don't sync huge folders or dev deps
          ARGS: "-rlgoDzvc -i --delete --exclude=node_modules"
          SOURCE: "backend/"
          REMOTE_HOST: ${{ secrets.VPS_IP }}
          REMOTE_USER: "root"
          TARGET: "/root/campus-compass-backend/"

      # ── 3. Install deps + apply config + restart services ──────────────────
      - name: Install & restart services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            BACKEND_DIR="/root/campus-compass-backend"
            cd "$BACKEND_DIR"

            # 1. Update systemd service file if changed
            if ! diff -q campus-compass.service /etc/systemd/system/campus-compass.service &>/dev/null; then
              echo "🔄 Service file changed — updating..."
              cp campus-compass.service /etc/systemd/system/campus-compass.service
              systemctl daemon-reload
            fi

            # 2. Update MediaMTX config if changed
            if ! diff -q mediamtx.yml /etc/mediamtx.yml &>/dev/null; then
              echo "🔄 MediaMTX config changed — updating..."
              cp mediamtx.yml /etc/mediamtx.yml
              systemctl restart mediamtx
              sleep 2
              systemctl is-active mediamtx && echo "✅ mediamtx running"
            fi

            # 3. Install / update Node.js dependencies
            echo "📦 Installing Node.js dependencies..."
            npm ci --omit=dev --silent

            # 4. Restart the backend service
            echo "♻️  Restarting campus-compass service..."
            systemctl restart campus-compass
            sleep 3
            systemctl is-active campus-compass && echo "✅ campus-compass running"

            # 5. Health check
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/health)
            if [ "$HTTP" = "200" ]; then
              echo "✅ Health check passed (HTTP $HTTP)"
            else
              echo "❌ Health check failed (HTTP $HTTP)"
              journalctl -u campus-compass -n 30 --no-pager
              exit 1
            fi

            echo ""
            echo "🎉 Deploy complete — $(date)"

      # ── 4. Notify on failure ───────────────────────────────────────────────
      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 VPS Deploy Failed — ${context.sha.substring(0, 7)}`,
              body: `**Workflow:** ${context.workflow}\n**Branch:** ${context.ref}\n**Commit:** ${context.sha}\n\n[View run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              labels: ['bug', 'deployment']
            })
