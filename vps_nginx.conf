user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 768;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # CORS Map - allow listed origins
    map $http_origin $cors_origin {
        default "";
        "http://localhost:3000" $http_origin;
        "https://campus-compass-vercel.app" $http_origin;
        "https://thanganat25.com" $http_origin;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name thanganat25.com;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name thanganat25.com;

        ssl_certificate /etc/letsencrypt/live/thanganat25.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/thanganat25.com/privkey.pem;

        # Main Backend Proxy (Arbitrator / JWT Token / Auth Callback)
        location /api/ {
            proxy_pass http://localhost:3001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;

            # CORS Headers
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }

        # MediaMTX WHEP Proxy (WebRTC on port 8189)
        # IMPORTANT: The trailing slash in proxy_pass strips the /stream/ prefix!
        location /stream/ {
            proxy_pass http://127.0.0.1:8189/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # CORS Headers
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
            add_header 'Access-Control-Expose-Headers' 'Location, Link' always;
            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }
    }
}